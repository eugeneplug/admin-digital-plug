<article class="journal-card">
    <a href="{{url}}">
        <span class="journal-art journal-art-{{art_variant}}" aria-hidden="true"><i></i><i></i><i></i></span>
        <div class="journal-copy">
            <time datetime="{{date_iso}}">{{date}}</time>
            <h3>{{title}}</h3>
            <span{{hide_excerpt}}>{{excerpt}}</span>
        </div>
    </a>
</article>
