name: 🚀 Deploy to SpaceWeb SFTP

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spaceweb-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
      - name: Check deployment error handling
        run: python3 -B .github/scripts/test_deploy.py
      - name: 📂 Sync files via SFTP
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          REMOTE_PATH: /home/t/tech1111/admin_digitalplug_ru/public_html
          SITE_URL: https://admin.digitalplug.ru
        run: python3 .github/scripts/deploy.py
