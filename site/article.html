<article class="site-article">
    <a class="text-link back-link" href="./#journal">{{back_icon}} К журналу</a>
    <p class="site-eyebrow"><time datetime="{{date_iso}}">{{date}}</time></p>
    <h1>{{title}}</h1>
    <p class="article-lead"{{hide_excerpt}}>{{excerpt}}</p>
    <div class="article-body">{{body}}</div>
</article>
