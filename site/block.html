<section class="site-block site-block-{{kind}}">
    <div class="site-block-content">
        <p class="site-eyebrow"{{hide_eyebrow}}>{{eyebrow}}</p>
        {{heading}}
        <p class="block-text"{{hide_text}}>{{text}}</p>
        <a class="button {{button_style}}" href="{{button_url}}"{{hide_button}}>{{button_text}}</a>
    </div>
    <div class="site-hero-art" aria-hidden="true"{{hide_art}}><i></i><i></i><i></i></div>
</section>
